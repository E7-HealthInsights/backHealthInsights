# ── Base de datos ─────────────────────────────────────────────────────────────
quarkus.datasource.db-kind = ${DB_KIND}
quarkus.datasource.username = ${DB_USERNAME}
quarkus.datasource.password = ${DB_PASSWORD}
quarkus.datasource.jdbc.url = ${DB_JDBC_URL}

quarkus.hibernate-orm.schema-management.strategy = ${DB_SCHEMA_STRATEGY}
quarkus.hibernate-orm.sql-load-script = no-file

# ── Firebase ──────────────────────────────────────────────────────────────────
firebase.credentials=${FIREBASE_SERVICE_ACCOUNT_LOCATION}

# ── HTTP / CORS ───────────────────────────────────────────────────────────────
quarkus.http.auth.proactive=false

quarkus.http.cors.enabled=true
quarkus.http.cors.origins = ${CORS_ORIGINS}
quarkus.http.cors.methods = GET, PUT, POST, DELETE, PATCH
quarkus.http.cors.headers=Authorization,Content-Type
quarkus.http.cors.exposed-headers=Content-Disposition
quarkus.http.cors.access-control-allow-credentials=true

# ── Google Cloud Storage ──────────────────────────────────────────────────────
gcs.bucket.name=${GCS_BUCKET_NAME}

# ── Kafka (Smallrye Reactive Messaging) ───────────────────────────────────────
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS}

# ── Canal de salida (Productor) ───────────────────────────────────────────────
mp.messaging.outgoing.dataset-csv-uploaded-out.connector=smallrye-kafka
mp.messaging.outgoing.dataset-csv-uploaded-out.topic=dataset-csv-uploaded
mp.messaging.outgoing.dataset-csv-uploaded-out.value.serializer=org.apache.kafka.common.serialization.StringSerializer

# ── Canal de entrada (Consumer) ───────────────────────────────────────────────
mp.messaging.incoming.dataset-csv-uploaded-in.connector=smallrye-kafka
mp.messaging.incoming.dataset-csv-uploaded-in.topic=dataset-csv-uploaded
mp.messaging.incoming.dataset-csv-uploaded-in.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.dataset-csv-uploaded-in.group.id=${KAFKA_CONSUMER_GROUP}
mp.messaging.incoming.dataset-csv-uploaded-in.auto.offset.reset=latest
mp.messaging.incoming.dataset-csv-uploaded-in.enable.auto.commit=false
mp.messaging.incoming.dataset-csv-uploaded-in.failure-strategy=ignore

# ── OpenAI ────────────────────────────────────────────────────────────────────
openai.api.key=${OPENAI_API_KEY}
openai.model=${OPENAI_MODEL}
openai.endpoint=${OPENAI_ENDPOINT}
openai.timeout-seconds=${OPENAI_TIMEOUT}

# ── Test ──────────────────────────────────────────────────────────────────────
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.username=sa
%test.quarkus.datasource.password=
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
%test.quarkus.datasource.jdbc.driver=org.h2.Driver
%test.quarkus.hibernate-orm.schema-management.strategy=drop-and-create
%test.quarkus.hibernate-orm.sql-load-script=import.sql

%test.quarkus.devservices.enabled=false
%test.mp.messaging.outgoing.dataset-csv-uploaded-out.connector=smallrye-in-memory
%test.mp.messaging.incoming.dataset-csv-uploaded-in.connector=smallrye-in-memory

quarkus.log.category."com.google.firebase".level=DEBUG
quarkus.log.category."org.acme".level=DEBUG

# OpenAPI / Swagger
# Habilita Swagger UI en todos los perfiles (por default solo en dev)
quarkus.swagger-ui.always-include=true

# Info general de la API
mp.openapi.extensions.info.title=HealthInsights API
mp.openapi.extensions.info.version=1.0.0
mp.openapi.extensions.info.description=API para análisis de diabetes en México