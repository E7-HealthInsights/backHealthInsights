# ── Dev local: Redpanda (Kafka-compatible, sin Zookeeper) ────────────────────
#
# Uso:
#   docker compose up -d          → levantar todo
#   docker compose down -v        → bajar y limpiar volúmenes
#   docker compose logs -f broker → ver logs del broker
#
# Puertos expuestos:
#   localhost:9092  → Kafka API (Quarkus se conecta aquí)
#   localhost:9644  → Redpanda Admin API
#   localhost:8080  → Redpanda Console (UI)
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Redpanda broker ───────────────────────────────────────────────────────
  broker:
    image: redpandadata/redpanda:v24.3.1
    container_name: hi-broker
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9093,external://0.0.0.0:9092
      - --advertise-kafka-addr internal://broker:9093,external://localhost:9092
      - --rpc-addr broker:33145
      - --advertise-rpc-addr broker:33145
      - --mode dev-container
      - --smp 1
      - --memory 512M
      - --default-log-level=warn
    ports:
      - "9092:9092"
      - "9644:9644"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  # ── Redpanda Console (UI) ─────────────────────────────────────────────────
  console:
    image: redpandadata/console:v2.7.2
    container_name: hi-console
    restart: unless-stopped
    depends_on:
      broker:
        condition: service_healthy
    environment:
      CONFIG_FILEPATH: /tmp/config.yml
    entrypoint: /bin/sh
    command: >
      -c "printf 'kafka:\n  brokers: [\"broker:9093\"]\nredpanda:\n  adminApi:\n    enabled: true\n    urls: [\"http://broker:9644\"]\n' > /tmp/config.yml && /app/console"
    ports:
      - "8080:8080"

  # ── Crear el topic al arrancar ────────────────────────────────────────────
  topic-init:
    image: redpandadata/redpanda:v24.3.1
    container_name: hi-topic-init
    depends_on:
      broker:
        condition: service_healthy
    entrypoint: /bin/bash
    command: >
      -c "
        rpk topic create dataset-csv-uploaded \
          --brokers broker:9093 \
          --partitions 3 \
          --replicas 1 \
          --topic-config retention.ms=86400000 \
          --topic-config message.max.bytes=5242880 &&
        echo 'Topic dataset-csv-uploaded creado OK'
      "
    restart: "no"

volumes:
  redpanda-data: